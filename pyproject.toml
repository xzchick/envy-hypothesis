[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envy-hypothesis"
version = "0.1.0"
description = "ENVY Hypothesis: encrypted, offline Analysis of Competing Hypotheses — structure a judgement in a native app window"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "cryptography>=42,<47",
  "PyQt6>=6.7,<7",
]

[project.scripts]
envy-hypothesis = "envy_hypothesis.cli:main"

[project.gui-scripts]
envy-hypothesis-gui = "envy_hypothesis.cli:main"

[tool.setuptools.packages.find]
include = ["envy_hypothesis*"]
